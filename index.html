<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ward Viewer</title>

    <link rel="stylesheet" href="leaflet/leaflet.css">
    <script src="leaflet/leaflet.js"></script>

    <style>
        #map-view {
            height: 80vh;
            width: 800px;
        }

        #loading-screen {
            display: none;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 0px;
            left: 0px;
            width: 100%;
            height: 100%;
            z-index: 500;
            background-color: rgb(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div id="loading-screen">
        <img src="www/spinner.gif" alt="Spinning loading gif" id="loading-screen-spinner">
    </div>
    <div id="map-view"></div>
    <script src="main.js"></script>
    <script>init_map()</script>
</body>
</html>
